name: RR GLOBAL Health Check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rr-ai-chat.html"
      - "rr-ai-manifest.json"
      - "rr-ai-sw.js"
      - "server/**"
      - ".github/workflows/rr-global-health.yml"

permissions:
  contents: read

concurrency:
  group: rr-global-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check RR AI website
        shell: bash
        run: |
          code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 25 'https://ritikyadav44025-ux.github.io/RR-GLOBAL/rr-ai-chat.html')"
          test "$code" = "200" || { echo "RR AI website returned HTTP $code"; exit 1; }
          echo "RR AI website: HTTP $code"

      - name: Check RR AI backend health
        shell: bash
        run: |
          code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 25 'https://rr-global-ai-api.onrender.com/health')"
          test "$code" = "200" || { echo "RR AI backend health returned HTTP $code"; exit 1; }
          echo "RR AI backend health: HTTP $code"
